allowBuilds:
  aws-sdk: true
  better-sqlite3: true
  esbuild: true
  protobufjs: true
  sharp: true
  workerd: true
catalog:
  "@types/node": ^24
  typescript: ^6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@0.1.24
  vite-plus: 0.1.24
  vitest: npm:@voidzero-dev/vite-plus-test@0.1.24
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
