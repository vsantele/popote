allowBuilds:
  aws-sdk: true
  better-sqlite3: true
  esbuild: true
  protobufjs: true
  sharp: true
  workerd: true
catalog:
  "@types/node": ^24
  typescript: ^6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plus: ^0.1.23
  vitest: npm:@voidzero-dev/vite-plus-test@latest
minimumReleaseAgeExclude:
  - '@better-auth/core@1.6.12 || 1.6.29'
  - '@better-auth/drizzle-adapter@1.6.12 || 1.6.29'
  - '@better-auth/kysely-adapter@1.6.12 || 1.6.29'
  - '@better-auth/memory-adapter@1.6.12 || 1.6.29'
  - '@better-auth/mongo-adapter@1.6.12 || 1.6.29'
  - '@better-auth/prisma-adapter@1.6.12 || 1.6.29'
  - '@better-auth/telemetry@1.6.12 || 1.6.29'
  - better-auth@1.6.12 || 1.6.29
  - svelte@5.56.0
  - '@inlang/cli@3.3.1'
  - '@inlang/paraglide-js@2.24.0'
  - '@inlang/sdk@3.0.0'
  - '@lix-js/sdk-darwin-arm64@0.12.0'
  - '@lix-js/sdk-linux-arm64@0.12.0'
  - '@lix-js/sdk-linux-x64@0.12.0'
  - '@lix-js/sdk-win32-x64@0.12.0'
  - '@lix-js/sdk@0.12.0'
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
